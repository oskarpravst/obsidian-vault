<svg xmlns="http://www.w3.org/2000/svg" width="560" height="245" viewBox="0 0 560 245" font-family="Helvetica, Arial, sans-serif">
<line x1="60" y1="140" x2="512.0" y2="140.0" stroke="#8c8c8c" stroke-width="1.6" stroke-linecap="round"/>

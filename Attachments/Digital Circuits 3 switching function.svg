<svg xmlns="http://www.w3.org/2000/svg" width="440" height="270" viewBox="0 0 440 270" font-family="Helvetica, Arial, sans-serif">
<rect x="130" y="20" width="120" height="200" stroke="#3b82f6" stroke-width="2" fill="none"/>
<line x1="90" y1="40" x2="130" y2="40" stroke="#8c8c8c" stroke-width="1.6" stroke-linecap="round"/>
<text x="70.5" y="45" fill="#8c8c8c" font-size="15" xml:space="preserve"><tspan font-size="15">x</tspan><tspan font-size="11" dy="4">1</tspan></text>

<line x1="90" y1="75" x2="130" y2="75" stroke="#8c8c8c" stroke-width="1.6" stroke-linecap="round"/>
<text x="70.5" y="80" fill="#8c8c8c" font-size="15" xml:space="preserve"><tspan font-size="15">x</tspan><tspan font-size="11" dy="4">2</tspan></text>

<line x1="90" y1="120" x2="130" y2="120" stroke="#8c8c8c" stroke-width="1.6" stroke-linecap="round"/>
<text x="73.5" y="125" fill="#8c8c8c" font-size="15" xml:space="preserve"><tspan font-size="15">x</tspan><tspan font-size="11" dy="4">i</tspan></text>

<line x1="90" y1="195" x2="130" y2="195" stroke="#8c8c8c" stroke-width="1.6" stroke-linecap="round"/>
<text x="70.5" y="200" fill="#8c8c8c" font-size="15" xml:space="preserve"><tspan font-size="15">x</tspan><tspan font-size="11" dy="4">n</tspan></text>

<text x="75" y="160" text-anchor="end" fill="#8c8c8c" font-size="15">⋮</text>
<text x="20" y="105" text-anchor="start" fill="#f59e0b" font-size="15">0/1</text>
<line x1="20" y1="125" x2="42.0" y2="125.0" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round"/>
<polygon points="50,125 42.0,121.0 42.0,129.0" fill="#f59e0b"/>
<line x1="250" y1="120" x2="420" y2="120" stroke="#8c8c8c" stroke-width="1.6" stroke-linecap="round"/>
<text x="260.0" y="110" fill="#f59e0b" font-size="15" xml:space="preserve"><tspan font-size="15">f(x</tspan><tspan font-size="11" dy="4">1</tspan><tspan font-size="15" dy="-4">, x</tspan><tspan font-size="11" dy="4">2</tspan><tspan font-size="15" dy="-4">, …, x</tspan><tspan font-size="11" dy="4">i</tspan><tspan font-size="15" dy="-4">, …, x</tspan><tspan font-size="11" dy="4">n</tspan><tspan font-size="15" dy="-4">)</tspan></text>

<text x="20" y="255" text-anchor="start" fill="#8c8c8c" font-size="15">how do we know whether xᵢ has an effect?</text>
</svg>
